<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Todo List</title>

    <link rel="stylesheet" href="style.css">

    <style>
        .icon {
            font-size: 7rem;
        }
    </style>
</head>

<body>

    <main class="container">

        <ul class="todo-list js-todo-list"></ul>

        <section class="empty-state">
            <h1 class="app-title">My Todo</h1>

            <i class="fas fa-tasks icon" aria-hidden="true"></i>

            <p class="empty-state__description">
                Type in the field below 👇 and press Enter to add your todo.
            </p>
        </section>

        <form class="formselect">
            <input
                type="text"
                class="inputselect"
                placeholder="Eg: Workout"
                aria-label="Enter a todo"
                autofocus
            >
        </form>

    </main>

    <script
        src="https://kit.fontawesome.com/dd8c49730d.js"
        crossorigin="anonymous">
    </script>

    <script src="script.js"></script>

</body>

</html>
